name: Build and Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: ./web
        run: npm ci

      - name: Test
        working-directory: ./web
        run: npx vitest run

      - name: Snapshot lists
        working-directory: ./web
        continue-on-error: true
        env:
          VITE_DEKUDEALS_KEY: ${{ secrets.VITE_DEKUDEALS_KEY }}
        run: npm run snapshot:lists

      - name: Snapshot covers
        working-directory: ./web
        continue-on-error: true
        env:
          SGDB_API_KEY: ${{ secrets.SGDB_API_KEY }}
          COVERS_PREVIOUS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/api/snapshot/covers.json
        run: npm run snapshot:covers

      # --ignore-scripts skips the prebuild hook: both snapshots already ran above, as separate steps
      - name: Build
        working-directory: ./web
        env:
          VITE_DEKUDEALS_KEY: ${{ secrets.VITE_DEKUDEALS_KEY }}
        run: npm run build --ignore-scripts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
